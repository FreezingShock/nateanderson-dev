name: Deploy

# Vercel builds only the `release` branch (see vercel.json). Merges into `integration` deploy nothing.
# This workflow adds a commit to `release` with the files of `integration`, which triggers one deployment.
# Skipped Vercel builds still count against the free plan's 100 deployments a day, so we avoid triggering them at all.

# Trigger: push a branch named deploy/<anything> (a thread creates it from integration, or run
# `git push origin integration:refs/heads/deploy/now`). The workflow deletes it afterwards.
# (workflow_dispatch and schedule only work for workflow files on the default branch, which is main.)
on:
    push:
        branches: ["deploy/**"]

permissions:
    contents: write

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: integration
                  fetch-depth: 0
            - name: Update release to match integration
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin release || true
                  if git rev-parse --verify -q origin/release >/dev/null; then
                      if git diff --quiet origin/release HEAD; then
                          echo "release already has integration's content; nothing to deploy"
                          exit 0
                      fi
                      parents="-p origin/release -p HEAD"
                  else
                      parents="-p HEAD"
                  fi
                  # A new commit (same files as integration) rather than a plain fast-forward: Vercel does not
                  # create a deployment for a commit SHA it has already seen on another branch.
                  new=$(git commit-tree HEAD^{tree} $parents -m "Release $(git rev-parse --short HEAD)")
                  git push origin "$new:refs/heads/release"
                  echo "release -> $new (integration $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
            - name: Remove trigger branch
              if: always()
              run: git push origin --delete "${GITHUB_REF_NAME}" || true
