name: Secret scan

# Scans the full history of each PR head and of the protected branches for committed secrets.
on:
    pull_request:
    push:
        branches: [integration, release]

permissions:
    contents: read

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Run gitleaks over the repository history
              run: |
                  docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
                    detect --source /repo --redact --no-banner --exit-code 1
